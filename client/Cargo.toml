[package]
name = "personal-dashboard-client"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23"
chrono = "0.4"
dotenvy = "0.15"
eframe = "0.37"
futures-util = "0.3"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "query", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
urlencoding = "2"
webbrowser = "1"
